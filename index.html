<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary -->
    <title>MELA &mdash; Small Business Management for Ethiopia</title>
    <meta name="description" content="MELA is an Ethiopian-first business management app. Track sales, expenses, inventory and get insights - all in one simple, offline-ready PWA. Available in English and Amharic." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="MELA Business Software" />
    <link rel="canonical" href="https://solution.pro.et/" />

    <!-- Open Graph -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://solution.pro.et/" />
    <meta property="og:site_name"    content="MELA" />
    <meta property="og:title"        content="MELA &mdash; Small Business Management for Ethiopia" />
    <meta property="og:description"  content="Track sales, expenses, inventory and get insights. Built for Ethiopian businesses. Works offline. Available in English and Amharic." />
    <meta property="og:image"        content="https://solution.pro.et/og-image.jpg" />
    <meta property="og:image:type"   content="image/jpeg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="MELA business management app" />
    <meta property="og:locale"       content="en_ET" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="MELA &mdash; Small Business Management for Ethiopia" />
    <meta name="twitter:description" content="Track sales, expenses, inventory and get insights. Built for Ethiopian businesses." />
    <meta name="twitter:image"       content="https://solution.pro.et/og-image.jpg" />

    <!-- PWA / App -->
    <meta name="theme-color"                        content="#123D35" />
    <meta name="mobile-web-app-capable"             content="yes" />
    <meta name="apple-mobile-web-app-capable"       content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"         content="MELA" />
    <meta name="application-name"                   content="MELA" />

    <!-- Icons -->
    <link rel="icon"           type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon"  href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest"       href="/favicon/site.webmanifest" />

    <!-- Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MELA",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Android, iOS",
      "description": "Ethiopian-first small business management PWA. Sales, inventory, expenses and insights.",
      "url": "https://solution.pro.et",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ETB" },
      "inLanguage": ["en", "am"],
      "publisher": { "@type": "Organization", "name": "MELA Business Software", "url": "https://solution.pro.et" }
    }
    </script>

    <!-- Font preloads -->
    <link rel="preload" href="/fonts/Outfit/Outfit-Regular.ttf"  as="font" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/Outfit/Outfit-SemiBold.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/Outfit/Outfit-Bold.ttf"     as="font" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/Outfit/Outfit-Medium.ttf"   as="font" type="font/ttf" crossorigin="anonymous" />
  </head>

    <a href="#main-content"
       class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[9999] focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-gray-900 focus:shadow-lg">
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
